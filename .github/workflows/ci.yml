name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zomboid-mt-optimizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build agent jar
        run: gradle agentJar --no-daemon

      - name: Run JUnit tests
        run: gradle test --no-daemon

      - name: Upload agent jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmtopt-agent
          path: zomboid-mt-optimizer/build/libs/zmtopt-agent.jar